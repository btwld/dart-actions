name: Publish to pub.dev

on:
  workflow_call:
    inputs:
      packages_folder_path:
        description: 'Path to the packages folder'
        required: true
        type: string
      packages:
        description: 'List of packages to publish (one per line)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare package list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Convert packages to JSON array
        id: set-matrix
        run: |
          packages=$(echo "${{ inputs.packages }}" | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$packages" >> $GITHUB_OUTPUT

  publish:
    name: Publish ${{ matrix.package }} to pub.dev
    needs: prepare
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart (provision OIDC)
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.35.0
          cache: true

      - name: Install dependencies for ${{ matrix.package }}
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        run: flutter pub get

      - name: Run tests for ${{ matrix.package }}
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        run: flutter test

      - name: Publish ${{ matrix.package }} - dry run
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        run: dart pub publish --dry-run

      - name: Publish ${{ matrix.package }} to pub.dev (OIDC)
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        run: dart pub publish --force
