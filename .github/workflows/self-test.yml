name: Self test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool:
    name: Release tool
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - name: Resolve
        working-directory: tool
        run: dart pub get
      - name: Format
        working-directory: tool
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: tool
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: tool
        run: dart test

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          # v1 files are left as they are; pr-title-check.yml has a known
          # default-input issue that v2 does not touch.
          ./actionlint -color \
            .github/workflows/release-*.yml \
            .github/workflows/self-test.yml
